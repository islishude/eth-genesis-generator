version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: "docker"
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directories:
      - /example
    groups:
      compose-images:
        patterns: ["*"]
    schedule:
      interval: monthly
