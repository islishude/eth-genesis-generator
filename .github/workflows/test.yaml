name: test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: make build
      - run: make check
      - run: make lint
      - run: make test

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ethgen:ci
          load: true
          cache-from: type=gha,scope=test-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=test-${{ runner.os }}-${{ runner.arch }}
      - name: Verify Docker image
        run: |
          docker run --name test --rm ethgen:ci --help
