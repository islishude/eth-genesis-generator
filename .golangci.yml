version: "2"
run:
  timeout: 15m
  tests: true

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - errorlint
    - nilerr
    - noctx
    - dupl
    - dupword
    - gocognit
    - modernize
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gocognit
          - gosec
      # Test fixtures can contain intentional repetitions, such as BIP-39 vectors.
      - path: _test\.go$
        linters:
          - dupword
  settings:
    dupl:
      threshold: 100
    gocognit:
      min-complexity: 30
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/islishude/eth-genesis-generator
