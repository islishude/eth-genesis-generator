# Run from the repository root:
#   docker compose -f example/docker-compose.init.yml up --build --abort-on-container-failure
#
# This builds the current eth-genesis-generator image, generates ./devnet/artifacts,
# and prepares runtime data consumed by example/docker-compose.yml.

name: devnet-init

x-log-local: &log-local
  driver: local

services:
  genesis:
    image: genesis-eth-generator:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["all", "--out", "/devnet/artifacts"]
    volumes:
      - type: bind
        source: ${PWD:?run this compose file from the repository root}/devnet
        target: /devnet
        bind:
          create_host_path: true
    logging: *log-local

  lighthouse-testnet-init:
    image: alpine:3.24.4
    restart: "no"
    command:
      - sh
      - -ec
      - |
        mkdir -p /devnet/runtime/lighthouse-testnet /devnet/runtime/lighthouse/beacon
        cp /devnet/artifacts/consensus/config.yaml /devnet/runtime/lighthouse-testnet/config.yaml
        cp /devnet/artifacts/consensus/genesis.ssz /devnet/runtime/lighthouse-testnet/genesis.ssz
        printf "0\n" > /devnet/runtime/lighthouse-testnet/deposit_contract_block.txt
        sleep 1
    depends_on:
      genesis:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${PWD:?run this compose file from the repository root}/devnet
        target: /devnet
        bind:
          create_host_path: true
    logging: *log-local

  reth-init:
    image: ghcr.io/paradigmxyz/reth:v2.11.0
    restart: "no"
    command:
      - init
      - --datadir=/data
      - --chain=/artifacts/execution/genesis.json
    depends_on:
      genesis:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${PWD:?run this compose file from the repository
          root}/devnet/runtime/reth
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ${PWD:?run this compose file from the repository root}/devnet/artifacts
        target: /artifacts
        read_only: true
        bind:
          create_host_path: true
    logging: *log-local

  lighthouse-validator-import:
    image: sigp/lighthouse:v8.3.3
    restart: "no"
    command:
      - sh
      - -ec
      - |
        mkdir -p /data
        if [ ! -f /data/.validator-import-complete ]; then
          lighthouse account validator import \
            --datadir=/data \
            --testnet-dir=/testnet \
            --directory=/artifacts/validators/keystores \
            --password-file=/artifacts/validators/keystores/password.txt \
            --reuse-password
          touch /data/.validator-import-complete
          sleep 1
        fi
    depends_on:
      lighthouse-testnet-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${PWD:?run this compose file from the repository
          root}/devnet/runtime/lighthouse/validator
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ${PWD:?run this compose file from the repository
          root}/devnet/runtime/lighthouse-testnet
        target: /testnet
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${PWD:?run this compose file from the repository root}/devnet/artifacts
        target: /artifacts
        read_only: true
        bind:
          create_host_path: true
    logging: *log-local
